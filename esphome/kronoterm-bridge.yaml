# ================================================================
#  Kronoterm (KSM) RS485 <-> Wi-Fi міст для інтеграції kronoterm_ksm
#  Плата: Raspberry Pi Pico W (або Pico 2 W) + модуль RS485 (MAX485)
#  Підключення до клемника TEX на платі KSM: A+, B-, GND
#
#  Ця прошивка НЕ створює сутностей у Home Assistant: вона лише
#  пересилає Modbus між Wi-Fi (TCP, порт 502) і шиною RS485.
#  Усі сутності створює інтеграція custom_components/kronoterm_ksm
#  (протокол "RTU через TCP", адреса = IP цього Pico, порт 502).
#
#  Компонент kt_bridge лежить у цьому репозиторії: esphome/components/kt_bridge.
#  В ESPHome Builder скопіюйте папку components/kt_bridge у /config/esphome/components/
#  (поряд з цим файлом), тоді рядок "source: components" нижче його знайде.
# ================================================================

substitutions:
  name: kronoterm-bridge
  friendly_name: Kronoterm bridge
  # Швидкість шини: 115200 для ADAPT / ETERA / VERSI / WPLV / ADAPT MAX,
  # 19200 для старих WPG (контролер V2.x)
  baud_rate: "115200"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

rp2:
  board: rpipicow        # Pico 2 W: rpipico2w

external_components:
  - source:
      type: local
      path: components
    components: [kt_bridge]

logger:
  level: INFO

# API лишається для OTA-оновлень і стану пристрою в ESPHome; сутностей Kronoterm тут немає
api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Статична адреса дуже бажана: інтеграція підключається саме до неї
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0

web_server:
  port: 80
  version: 3

uart:
  id: rs485_uart
  tx_pin: GPIO0          # -> DI  модуля
  rx_pin: GPIO1          # <- RO  модуля
  baud_rate: ${baud_rate}
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

kt_bridge:
  uart_id: rs485_uart
  port: 502
  flow_control_pin: GPIO2   # -> DE+RE модуля; видаліть рядок, якщо модуль з автонапрямком

# Корисне для діагностики в ESPHome
sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
